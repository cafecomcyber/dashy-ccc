Excelente! A informação de que é um fork do Dashy é muito útil.
O Dashy é um painel de controle que pode ser usado para gerenciar links e serviços, e a sua interface é altamente personalizável, o que explica a semelhança com o LinkStack.
Nova Hipótese de Causa
O Dashy, por padrão, é um painel de controle somente leitura para usuários comuns. Para que a edição seja possível, é necessário configurar um provedor de autenticação e, mais importante, habilitar o modo de edição para os usuários administradores.
O fato de você conseguir fazer login com a credencial de admin, mas não conseguir editar, sugere que:
O Login está funcionando, mas a permissão de edição não está sendo corretamente ativada após o login.
O modo de edição não está ativado no arquivo de configuração principal (conf.yml ou equivalente).
A credencial de administrador não tem as permissões corretas para o Dashy.
