Novo conhecimento sugerido
Verifiquei que Dashy, baseado em configurações padrão, requer habilitar permissões de edição no arquivo de configuração para o modo administrador; sem isso, mesmo logado, não é possível editar.

Verifiquei que, para editar no Dashy, é necessário ativar `enableConfigEditing` e `disableConfiguration` deve estar false; configurações padrão não permitem edição. No Vercel, a edição está limitada por ser ambiente estático, impossibilitando salvar alterações. Next, confirmarei essas configurações no arquivo YAML e na documentação do Vercel.

