Lite
Com base na nova informação de que o seu projeto é um fork do Dashy e que está hospedado no Vercel via CI/CD, e na sua confirmação de que o problema pode estar em um parâmetro de configuração, cheguei à conclusão e à solução mais provável.
O Diagnóstico: Dashy no Vercel é Somente Leitura
O problema que você está enfrentando não é um erro de permissão ou de login, mas sim uma limitação fundamental da forma como o Dashy interage com o Vercel.
O Dashy oferece uma funcionalidade de edição e salvamento de configuração diretamente pela interface de usuário (UI), mas essa funcionalidade requer um servidor de backend em execução para escrever as alterações no arquivo de configuração (conf.yml).
Vercel e Hospedagem Estática: Quando você usa o Vercel para hospedar o Dashy, ele o executa como um site estático (ou serverless), que não tem um servidor persistente onde o Dashy possa salvar o arquivo conf.yml após a edição.
Consequência: Mesmo que você esteja logado como administrador, o botão de "Salvar" a configuração no Dashy não funciona porque a aplicação não tem onde salvar as alterações no ambiente do Vercel. A documentação do Dashy confirma isso:
"Se você estiver executando o Dashy usando um provedor de hospedagem estática (como Vercel), então não há um servidor Node, e portanto, a ação de salvar a configuração não funcionará via UI."
A Solução: Edição Externa e Re-deploy
Para editar o seu Dashy hospedado no Vercel, você deve seguir o fluxo de trabalho de um aplicativo estático:
Edite o Arquivo de Configuração: Você deve editar o arquivo de configuração principal (geralmente conf.yml ou appConfig.yml) diretamente no seu repositório do GitHub.
Commit e Push: Salve as alterações e envie-as (faça commit e push) para o seu repositório no GitHub.
CI/CD (Vercel): O Vercel detectará a alteração no seu repositório e automaticamente fará um novo deploy (re-deploy) do seu site, aplicando a nova configuração.
Resumo dos Passos para Edição:
Ação Atual (Com Falha)
Ação Correta (Para Vercel)
1. Fazer login como Admin no Dashy.
1. Acessar o repositório do Dashy no GitHub.
2. Clicar em "Config" e editar pela UI.
2. Editar o arquivo conf.yml (ou similar) diretamente no GitHub.
3. Clicar em "Salvar" (falha).
3. Fazer commit e push das alterações.
4. O Vercel faz o re-deploy automaticamente, e as mudanças aparecem no site.
Ação Imediata para Você
Se você me enviar o conteúdo do seu arquivo de configuração (conf.yml ou similar), posso verificar se há algum parâmetro que possa estar desabilitando a visualização do modo de edição, mas o problema principal de salvar a edição é a limitação do Vercel.
Se você deseja apenas editar o conteúdo, por favor, edite o arquivo conf.yml no GitHub e faça o commit e push.
Se você quiser que a edição pela UI funcione, você precisará hospedar o Dashy em um ambiente que suporte um servidor persistente (como um servidor virtual privado, Docker, ou um serviço de hospedagem que suporte Node.js).
Fico à disposição para analisar o seu arquivo de configuração, caso queira confirmar se há algum outro parâmetro que possa estar causando problemas. Caso contrário, a solução é a edição via GitHub.
