Se não puder compartilhar o repositório, o próximo passo seria você mesmo verificar o código, procurando pela função que lida com o salvamento ou edição dos links após o login. O erro 500 que mencionei é um erro de servidor que geralmente indica uma falha no código de backend quando ele tenta processar sua requisição de edição.
