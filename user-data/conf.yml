Lite
Com base na análise do site e em pesquisas detalhadas, identifiquei a causa mais provável para o problema de edição que você está enfrentando, mesmo logado como administrador.
1. Identificação da Plataforma
A página "Links Úteis" do Café com Cyber (https://www.cafecomcyber.com.br/useful-links ), com seus botões de "Log In" e "Config" e o estilo visual, é quase certamente construída usando o LinkStack.
O LinkStack é uma plataforma de código aberto e auto-hospedada, projetada para ser uma alternativa ao Linktree, permitindo que você gerencie e exiba vários links em uma única página.
2. Causa Mais Provável do Problema de Edição
O problema de não conseguir editar, mesmo com credenciais de administrador, é um bug conhecido que afeta algumas versões do LinkStack, especificamente a partir da versão 4.8.1.
Sintoma: Ao tentar salvar ou adicionar novos links, o sistema retorna um Erro 500 (Internal Server Error).
Motivo: Este erro não é uma falha de permissão de administrador, mas sim uma falha no código da aplicação que ocorre durante a tentativa de salvar os dados. A causa raiz está relacionada a uma mudança no formato de armazenamento dos dados de links (JSON) em versões mais recentes, o que causa um erro de formatação no banco de dados.
3. Soluções e Próximos Passos
Como o LinkStack é uma aplicação auto-hospedada, a solução deve ser aplicada diretamente no seu servidor.
Opção 1: Atualizar para uma Versão Corrigida (Recomendado)
Se o seu LinkStack estiver em uma versão vulnerável (como a 4.8.4, que foi citada no bug), a melhor solução é atualizar para a versão mais recente do LinkStack, que deve incluir a correção para este erro.
Acesse o Painel de Administração do seu LinkStack.
Procure pela notificação de Atualização e siga o procedimento para atualizar a plataforma.
Opção 2: Aplicar o Workaround (Se a atualização não for possível)
Se a atualização automática falhar ou se você precisar de uma solução imediata, a comunidade do LinkStack identificou um workaround que envolve a manipulação manual dos dados:
Faça um Backup completo do seu LinkStack.
Exporte os dados dos seus links (geralmente no formato JSON) através do Painel de Administração.
Edite o arquivo JSON exportado para adicionar dois campos obrigatórios que faltam nas versões antigas, mas são exigidos pelas novas:
Para itens que são links (têm um valor em link), adicione: "type": "link" e "type_params": "{\"custom_html\":false,\"ignore_container\":false,\"include_libraries\":[]}"
Para itens que são cabeçalhos (têm link: null), adicione: "type": "heading" e "type_params": "{\"custom_html\":true,\"ignore_container\":false,\"include_libraries\":[]}"
Importe o arquivo JSON corrigido de volta para o LinkStack.
Opção 3: Verificar Logs do Servidor
Se o problema persistir, o próximo passo é verificar os logs de erro do seu servidor (geralmente os logs do PHP ou do servidor web como Apache/Nginx). O erro 500 deve ter uma entrada detalhada no log que indicará exatamente qual arquivo e linha de código está causando a falha, o que é crucial para um diagnóstico mais preciso.
Se você puder me informar a versão do LinkStack que você está usando, posso tentar encontrar uma correção mais específica. Caso contrário, a atualização é o caminho mais seguro.
Fico à disposição para ajudar nos próximos passos!
