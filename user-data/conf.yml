Obrigado por enviar o conteúdo do seu arquivo conf.yml.
Analisando o arquivo de configuração do seu Dashy, encontrei o parâmetro que está causando o problema de não conseguir editar pela interface, mesmo como administrador.
O Problema Encontrado no conf.yml
O problema está na seção appConfig:
YAML
appConfig:
  # ...
  disableConfiguration: true
  # ...
O parâmetro disableConfiguration está definido como true.
Parâmetro
Valor Atual
Significado
disableConfiguration
true
Desabilita completamente a visualização e edição da configuração através da interface de usuário (UI) para TODOS os usuários, incluindo administradores.
A Solução
Para que você possa ver e tentar usar o modo de edição (o que, como expliquei, só funcionará para visualização no Vercel, mas não para salvar), você precisa alterar este parâmetro para false.
Passo a Passo para a Correção:
Acesse seu repositório do Dashy no GitHub.
Abra o arquivo conf.yml para edição.
Localize a linha disableConfiguration: true e altere para disableConfiguration: false.
YAML
appConfig:
  # ...
  disableConfiguration: false # <-- ALTERAR AQUI
  # ...
Faça commit e push da alteração.
O Vercel fará o re-deploy e a opção de edição deverá aparecer na sua interface do Dashy.
Observação Importante sobre o Vercel
Reforço que, mesmo após esta correção, a função de salvar as alterações feitas pela UI não funcionará no Vercel devido à sua natureza de hospedagem estática.
Você deve continuar a fazer suas edições de conteúdo (links, seções, etc.) diretamente no arquivo conf.yml no GitHub, e o Vercel se encarregará de atualizar o site.
Se você tiver mais alguma dúvida ou precisar de ajuda para editar o conteúdo do conf.yml, estou à disposição!
