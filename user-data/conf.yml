pageInfo:
  title: Links Úteis
  description: Café com Cyber
  navLinks:
    - title: Voltar pro Site
      path: https://www.cafecomcyber.com.br/
      target: sametab
  logo: https://cafecomcyber.com.br/favicon.ico
  footerText: CCC | 2025

appConfig:
  theme: default
  layout: auto
  iconSize: medium
  customColors:
    deep-ocean:
      primary: '#aabbc3'
      background: '#151e2d'
      background-darker: '#151c29'
  startingView: minimal
  defaultOpeningMethod: newtab
  statusCheck: false
  statusCheckInterval: 0
  backgroundImg: ''
  faviconApi: allesedv
  routingMode: history
  enableMultiTasking: false
  widgetsAlwaysUseProxy: false
  webSearch:
    disableWebSearch: false
    searchEngine: ''
    openingMethod: newtab
    searchBangs: {}
  enableFontAwesome: true
  enableMaterialDesignIcons: true

  hideComponents:
    hideHeading: false
    hideNav: false
    hideSearch: false
    hideSettings: false
    hideFooter: false

  auth:
    enableGuestAccess: false
    users:
      - user: admin
        hash: 903084bfa90e89132c386b42d8c765f14b1d4d947162bbb682c9c627fb036c63
        type: admin
    enableOidc: false
    oidc: {}
    enableHeaderAuth: false
    headerAuth:
      userHeader: ''
      proxyWhitelist: []
    enableKeycloak: false

  showSplashScreen: false
  preventWriteToDisk: false
  preventLocalSave: false
  disableConfiguration: false
  disableConfigurationForNonAdmin: true
  allowConfigEdit: true
  enableServiceWorker: false
  disableContextMenu: false
  disableUpdateChecks: false
  disableSmartSort: false
  enableErrorReporting: false

